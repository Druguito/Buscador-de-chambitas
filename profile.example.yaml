# Copia este archivo a profile.yaml y edítalo con lo tuyo.
#   cp profile.example.yaml profile.yaml   (o cópialo a mano)

nombre: Matias Pino

# Cargos / tecnologías con los que quieres encontrar ofertas (una búsqueda c/u).
busquedas:
  - Laravel
  - PHP
  - Backend Developer
  - Full Stack
  - QA

# Tus skills. Cada una que aparezca en una oferta le suma puntaje.
skills:
  - PHP
  - Laravel
  - PostgreSQL
  - React
  - Docker
  - TypeScript
  - Node.js
  - REST
  - SQL
  - Git

# Si una oferta contiene alguna de estas palabras, se descarta sola.
evitar:
  - Ventas
  - Comercial
  - Call center

preferencias:
  solo_remoto: false
  ubicaciones:
    - Santiago
    - Remoto
    - Chile
    - Concepcion
    - Talcahuano
    - Hualpen
    - Coronel

# Puntaje mínimo (cuántas skills debe tener al menos) para guardarla.
puntaje_minimo: 1

# Qué páginas usar (pon false a las que no quieras).
fuentes:
  getonboard: true
  chiletrabajos: true
  computrabajo: true
  trabajando: true
  linkedin: false   # útil, pero LinkedIn tira 429 si lo corres muchas veces seguidas
